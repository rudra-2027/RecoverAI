spring.application.name=recoverai
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

recoverai.max-retries=3
recoverai.escalate-below-probability=20
recoverai.peak-start-hour=10
recoverai.peak-end-hour=13
# recoverai.api-key=${RECOVERAI_API_KEY:dev-api-key}
recoverai.gemini-api-key=${GEMINI_API_KEY}

#frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}
frontend.allowed-origins=${VITE_CLIENT_BASE_URL}
